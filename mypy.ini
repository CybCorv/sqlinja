[mypy]
python_version = 3.10
strict = True

# setup.py needs types-setuptools, a dev-only stub the CI does not install
[mypy-setup]
ignore_errors = True

# Test methods are exempt from the annotation rules the package and the
# examples follow: "-> None" on every test case catches nothing.
[mypy-tests.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False
